apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../workspaces/controller/manifests/kustomize/overlays/gateway-api

images:
  - name: ghcr.io/kubeflow/notebooks/workspaces-controller
    newName: <REGISTRY>/workspaces-controller
    newTag: <TAG>

configMapGenerator:
  - name: kubeflow-workspaces-gateway-api-config
    namespace: kubeflow-workspaces
    behavior: merge
    literals:
      # Envoy Gateway does not implement the Gateway API ExternalAuth filter;
      # the equivalent check is attached with a SecurityPolicy instead.
      - EXTERNAL_AUTH_URL=
