name: E2E Tests

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - notebooks-v2
      - v*-branch
  pull_request:
    paths:
      - 'workspaces/**'
      - 'testing/**'

jobs:
  # Fast feedback (typecheck, lint, spec paths, formatting) before spending time on a cluster.
  e2e-static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: testing/e2e
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ./testing/e2e/package.json
          cache: npm
          cache-dependency-path: ./testing/e2e/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          # Static checks don't run Cypress, so skip its binary download.
          CYPRESS_INSTALL_BINARY: '0'

      - name: Run static checks
        run: npm run test:static

  e2e-test:
    needs: e2e-static
    runs-on: ubuntu-latest
    env:
      # Colorize `cypress run` / headless Electron logs so CI output is readable.
      TERM: xterm-256color
      # Read by the testing/ Makefile and scripts, so the cluster name is defined once.
      KIND_CLUSTER_NAME: local-e2e
    defaults:
      run:
        working-directory: testing
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ./testing/e2e/package.json
          cache: npm
          cache-dependency-path: ./testing/e2e/package-lock.json

      - name: Set up Kind
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          config: ./testing/kind-1-35.yaml
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}

      - name: Install cluster dependencies
        run: make setup-deps

      - name: Deploy components
        run: make deploy-all

      - name: Verify cluster readiness
        run: make cluster-readiness

      - name: Run e2e tests
        run: make local-e2e

      - name: Upload test artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-test-results
          # Videos for passing specs are deleted by the `after:spec` hook in cypress/support/plugin/index.ts,
          # so only the videos/screenshots relevant to the failure are uploaded here.
          path: |
            testing/e2e/cypress/videos/
            testing/e2e/cypress/screenshots/
          retention-days: 7
          if-no-files-found: ignore
