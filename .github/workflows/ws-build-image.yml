name: Build Image

# NOTE: There is no `permissions` key set in this workflow on purpose:
#
# A reusable workflow may only request permissions its caller already grants,
# and the need for `packages: write` depends on the caller. However, setting
# `packages: write` breaks validation for callers that only grant
# `contents: read`, and declaring anything here caps the token at those
# permissions, which would break the publish flow.

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        description: "the name of the image"
        type: string

      tag_with_latest:
        default: false
        description: "if true, image tags will include 'latest'"
        type: boolean
      tag_with_semver:
        default: false
        description: "if true, image tags will include the raw version from semver_raw"
        type: boolean
      tag_with_sha:
        default: false
        description: "if true, image tags will include the commit SHA (both short and long)"
        type: boolean

      semver_raw:
        default: "UNSET_SEMVER"
        description: "the raw semver version (e.g., from VERSION file), used if tag_with_semver is true"
        type: string

      build_file:
        required: true
        description: "path to Dockerfile"
        type: string
      build_context:
        required: true
        description: "path to build context folder"
        type: string
      build_platforms:
        required: true
        description: "list of target platforms for build, comma separated (e.g., linux/amd64,linux/arm64/v8)"
        type: string

      push_to_registry:
        default: false
        description: "if true, push the built image to the registry"
        type: boolean

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  build_image:
    name: Build '${{ inputs.image_name }}' Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Install Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ inputs.push_to_registry }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Image Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.IMAGE_REGISTRY }}/${{ inputs.image_name }}
          flavor: |
            latest=${{ inputs.tag_with_latest }}
          tags: |
            type=semver,priority=1000,pattern={{raw}},enable=${{ inputs.tag_with_semver }},value=${{ inputs.semver_raw }}
            type=sha,priority=200,prefix=sha-,format=short,enable=${{ inputs.tag_with_sha }}
            type=sha,priority=100,prefix=sha-,format=long,enable=${{ inputs.tag_with_sha }}

      - name: Build and Push Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          annotations: ${{ steps.meta.outputs.annotations }}
          context: ${{ inputs.build_context }}
          file: ${{ inputs.build_file }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ inputs.build_platforms }}
          push: ${{ inputs.push_to_registry }}
          tags: ${{ steps.meta.outputs.tags }}
