name: PVCViewer Controller unit tests
on:
  pull_request:
    paths:
      - components/pvcviewer-controller/**
      - releasing/version/VERSION
    branches:
      - main
      - notebooks-v1
      - 'v*-branch'      

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Install Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: 'components/pvcviewer-controller/go.mod'
        check-latest: true

    - name: Run unit tests
      run: |
        cd components/pvcviewer-controller
        make test