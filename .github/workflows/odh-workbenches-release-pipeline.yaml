name: ODH Workbenches Release Pipeline

on:
  workflow_dispatch:
    inputs:
      new-image-version:
        description: "NEXT version (n+1) for tekton to track. Must be higher than current tekton tag."
        required: true
        type: string
      allow-sync:
        description: "Run branch sync (main→stable→v2.x)? Disabled by default."
        required: false
        type: boolean
        default: false

permissions: {}

env:
  # Derived from the repo where the workflow runs — works correctly on forks.
  REPO: ${{ github.repository }}
  RELEASE_BRANCH: v2.x
  # Tekton push file containing the output-image tag to read and bump.
  TEKTON_PUSH_FILE: .tekton/odh-workbenches-controller-push.yaml
  # Full image reference (registry/org/name) without tag.
  IMAGE_REF: quay.io/opendatahub/odh-workbenches-controller
  # Runtime image pin: file and the key whose value gets updated on release.
  PARAMS_ENV_FILE: workspaces/controller/manifests/kustomize/overlays/gateway/params.env
  PARAMS_ENV_KEY: WORKBENCH_CONTROLLER_IMAGE

jobs:
  validate-input:
    name: Validate version input
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Validate version format
        env:
          NEW_VERSION: ${{ inputs.new-image-version }}
        run: |
          # Validate version format (alphanumeric, dots, underscores, hyphens only)
          if ! [[ "$NEW_VERSION" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "::error::Invalid version format: $NEW_VERSION"
            echo "Version must contain only alphanumeric characters, dots, underscores, and hyphens"
            exit 1
          fi
          echo "Version format validated: $NEW_VERSION"

  # Step 1 (Optional): Sync main -> stable
  # Disabled by default - branch syncs should follow Bodies of Water approach
  # where syncs happen asynchronously and are gated by test results.
  sync-main-to-stable:
    name: Sync main to stable
    needs: validate-input
    permissions:
      contents: write
    if: ${{ inputs.allow-sync }}
    uses: opendatahub-io/workbenches/.github/workflows/sync-branches.yaml@main
    with:
      source: "main"
      target: "stable"

  # Step 2 (Optional): Sync stable -> v2.x
  sync-stable-to-release:
    name: Sync stable to release branch
    needs: sync-main-to-stable
    permissions:
      contents: write
    if: ${{ inputs.allow-sync }}
    uses: opendatahub-io/workbenches/.github/workflows/sync-branches.yaml@main
    with:
      source: "stable"
      target: "v2.x"

  # Step 3: Update image versions and push the release branch.
  push-branch:
    name: Update image versions and push branch
    needs: [validate-input, sync-stable-to-release]
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      branch_name: ${{ steps.create-branch.outputs.branch_name }}
      release_version: ${{ steps.extract-tags.outputs.controller_tag }}
    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Fetch latest release branch after sync
        run: |
          # Ensure we have the latest release branch state after sync jobs completed
          git fetch origin "$RELEASE_BRANCH"
          git reset --hard "origin/$RELEASE_BRANCH"
          echo "Checked out latest $RELEASE_BRANCH at $(git rev-parse HEAD)"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Extract current tekton image tag from release branch
        id: extract-tags
        env:
          NEW_VERSION: ${{ inputs.new-image-version }}
        run: |
          # Extract current output-image tag from the tekton push file.
          # Escape dots in IMAGE_REF so they are treated as literals in the regex.
          ESCAPED_REF="${IMAGE_REF//./\\.}"
          CONTROLLER_TAG=$(grep -oP "${ESCAPED_REF}:\K[^\s\"]+" "$TEKTON_PUSH_FILE")

          if [ -z "$CONTROLLER_TAG" ]; then
            echo "::error::Failed to extract tag from ${TEKTON_PUSH_FILE}"
            exit 1
          fi

          echo "## Current Tekton Tag" >> $GITHUB_STEP_SUMMARY
          echo "- Workbenches Controller: \`$CONTROLLER_TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## New Version (input): \`$NEW_VERSION\`" >> $GITHUB_STEP_SUMMARY

          # Validate: NEW_VERSION must be strictly greater than the current tag
          if [ "$NEW_VERSION" = "$CONTROLLER_TAG" ]; then
            echo "::error::New version ($NEW_VERSION) must be greater than current tag ($CONTROLLER_TAG)"
            exit 1
          fi
          if [ "$(printf '%s\n' "$CONTROLLER_TAG" "$NEW_VERSION" | sort -V | tail -n1)" != "$NEW_VERSION" ]; then
            echo "::error::New version ($NEW_VERSION) must be greater than current tag ($CONTROLLER_TAG)"
            exit 1
          fi

          echo "Current Workbenches Controller tag: $CONTROLLER_TAG"
          echo "New version to set: $NEW_VERSION"

          echo "controller_tag=$CONTROLLER_TAG" >> $GITHUB_OUTPUT

      - name: Update params.env with current tag
        env:
          CONTROLLER_TAG: ${{ steps.extract-tags.outputs.controller_tag }}
        run: |
          COUNT=$(grep -c "${PARAMS_ENV_KEY}=${IMAGE_REF}:" "$PARAMS_ENV_FILE" || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Expected exactly 1 match for ${PARAMS_ENV_KEY}=${IMAGE_REF}: in ${PARAMS_ENV_FILE}, found ${COUNT}"
            exit 1
          fi

          # Promote the current tekton tag into the runtime image pin
          sed -i "s|${PARAMS_ENV_KEY}=${IMAGE_REF}:.*|${PARAMS_ENV_KEY}=${IMAGE_REF}:${CONTROLLER_TAG}|" \
            "$PARAMS_ENV_FILE"

          if ! grep -q "${PARAMS_ENV_KEY}=${IMAGE_REF}:${CONTROLLER_TAG}" "$PARAMS_ENV_FILE"; then
            echo "::error::Substitution failed — ${PARAMS_ENV_KEY}=${IMAGE_REF}:${CONTROLLER_TAG} not found in ${PARAMS_ENV_FILE}"
            exit 1
          fi

          echo "Updated ${PARAMS_ENV_FILE} with current tekton tag: ${CONTROLLER_TAG}"

      - name: Update tekton file with new version
        env:
          NEW_VERSION: ${{ inputs.new-image-version }}
        run: |
          COUNT=$(grep -c "value: ${IMAGE_REF}:" "$TEKTON_PUSH_FILE" || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Expected exactly 1 match for value: ${IMAGE_REF}: in ${TEKTON_PUSH_FILE}, found ${COUNT}"
            exit 1
          fi

          # Bump the tekton push file to track the next version
          sed -i "s|value: ${IMAGE_REF}:.*|value: ${IMAGE_REF}:${NEW_VERSION}|" \
            "$TEKTON_PUSH_FILE"

          if ! grep -q "value: ${IMAGE_REF}:${NEW_VERSION}" "$TEKTON_PUSH_FILE"; then
            echo "::error::Substitution failed — value: ${IMAGE_REF}:${NEW_VERSION} not found in ${TEKTON_PUSH_FILE}"
            exit 1
          fi

          echo "Updated ${TEKTON_PUSH_FILE} with new version: ${NEW_VERSION}"

      - name: Show changes
        run: |
          echo "=== Changes to be committed ==="
          git diff

      - name: Create branch and commit changes
        id: create-branch
        env:
          # Release version is the current tekton tag being promoted to params.env,
          # not the NEXT version used to bump tekton for future builds.
          RELEASE_VERSION: ${{ steps.extract-tags.outputs.controller_tag }}
          NEW_VERSION: ${{ inputs.new-image-version }}
        run: |
          BRANCH_NAME="release/${RELEASE_VERSION}"
          git checkout -b "$BRANCH_NAME"

          git add -A
          git commit -m "chore: release ${RELEASE_VERSION}

          - Update controller image reference to ${RELEASE_VERSION}
          - Set tekton pipeline to track ${NEW_VERSION}

          Signed-off-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

          git push origin "$BRANCH_NAME"

          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

  # Step 4: Open the Pull Request.
  # Scoped to pull-requests: write only — the branch was already pushed above.
  # Needs always() guard for the same reason as push-branch: the skipped sync
  # jobs propagate transitively and would otherwise skip this job too.
  create-pr:
    name: Create Pull Request
    needs: push-branch
    if: ${{ always() && needs.push-branch.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    outputs:
      pr_url: ${{ steps.create-pr.outputs.pr_url }}
      pr_number: ${{ steps.create-pr.outputs.pr_number }}
    steps:
      - name: Create Pull Request
        id: create-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.push-branch.outputs.release_version }}
          NEW_VERSION: ${{ inputs.new-image-version }}
          BRANCH_NAME: ${{ needs.push-branch.outputs.branch_name }}
        run: |
          PR_URL=$(gh pr create \
            --repo "$REPO" \
            --base "$RELEASE_BRANCH" \
            --head "$BRANCH_NAME" \
            --title "chore: release ${RELEASE_VERSION}" \
            --body "## Release ${RELEASE_VERSION}

          This PR prepares the release by:

          1. **Promoting controller image** to \`${RELEASE_VERSION}\` (current tekton build)
          2. **Setting tekton pipeline** to track \`${NEW_VERSION}\` for future builds

          ### Files Updated

          - \`${PARAMS_ENV_FILE}\`
          - \`${TEKTON_PUSH_FILE}\`

          ### After Merge

          Once this PR is merged, a GitHub release \`${RELEASE_VERSION}\` will be automatically created.

          ---
          *Generated by ODH Workbenches Release Pipeline*")

          PR_NUMBER=$(gh pr view "$PR_URL" --repo "$REPO" --json number --jq '.number')

          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

          echo "Created PR: $PR_URL"

  summary:
    name: Release Pipeline Summary
    needs: [push-branch, create-pr]
    if: ${{ always() && needs.create-pr.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Output summary
        env:
          PR_URL: ${{ needs.create-pr.outputs.pr_url }}
          RELEASE_VERSION: ${{ needs.push-branch.outputs.release_version }}
          NEW_VERSION: ${{ inputs.new-image-version }}
        run: |
          echo "## ODH Workbenches Release Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Release version: \`${RELEASE_VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "### Next tekton version: \`${NEW_VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Review and merge the PR: ${PR_URL}" >> $GITHUB_STEP_SUMMARY
          echo "2. Once merged, GitHub release \`${RELEASE_VERSION}\` will be automatically created" >> $GITHUB_STEP_SUMMARY
