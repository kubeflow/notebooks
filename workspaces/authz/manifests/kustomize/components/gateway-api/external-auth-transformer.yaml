# Adds the GEP-1494 ExternalAuth filter to the statically defined HTTPRoutes.
#
# The filter is inserted at index 0 so that authorization runs before the
# existing URLRewrite filter, and so that the authorization service sees the
# path the client actually requested. Workspace HTTPRoutes are generated by the
# controller and get the same filter from its ext-authz settings.
#
# Requires the Gateway API experimental channel: ExternalAuth is an Extended,
# experimental feature (GEP-1494).
apiVersion: builtin
kind: PatchTransformer
metadata:
  name: workspaces-external-auth
patch: |-
  - op: add
    path: /spec/rules/0/filters/0
    value:
      type: ExternalAuth
      externalAuth:
        protocol: GRPC
        backendRef:
          name: workspaces-authz
          namespace: kubeflow-workspaces
          port: 9001
target:
  group: gateway.networking.k8s.io
  version: v1
  kind: HTTPRoute
  name: workspaces-(backend|frontend)
