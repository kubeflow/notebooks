# Workspace HTTPRoutes are generated by the controller in each user namespace,
# so they reference the authorization service across namespaces.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: workspaces-authz
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
  to:
  - group: ""
    kind: Service
    name: workspaces-authz
