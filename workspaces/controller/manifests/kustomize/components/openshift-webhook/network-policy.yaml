apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workspaces-controller
spec:
  podSelector:
    matchLabels:
      app: workspaces-controller
      app.kubernetes.io/component: controller-manager
  ingress:
  - ports:
    - protocol: TCP
      port: https-webhook
    # allow traffic from anywhere, as the kubernetes api server must reach the webhook
    from: []
  - ports:
    - protocol: TCP
      port: 8081
    # health-probe port (--health-probe-bind-address=:8081); must be listed
    # because the policy above already selects this pod, implicitly denying
    # any port not covered by an ingress rule.
  policyTypes:
  - Ingress
