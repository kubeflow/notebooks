## These are just example definitions for Workspace, please thoroughly vet
## them and customize them for your usecase before using them in a production
## setting!

apiVersion: kubeflow.org/v1beta1
kind: Workspace
metadata:
  name: jupyterlab-workspace
spec:
  ## if the workspace is paused (no pods running)
  paused: false

  ## an optional human-readable name, displayed in the UI instead of metadata.name
  displayName: "Example JupyterLab Workspace"

  ## the WorkspaceKind to use
  kind: "jupyterlab"

  ## options for "podTemplate"-type WorkspaceKinds
  ##
  podTemplate:

    ## metadata to be applied to the Pod resource
    ##
    podMetadata:

      ## labels to be applied to the Pod resource
      ##  - labels are required to support integration with the PodDefault resource:
      ##    https://github.com/kubeflow/kubeflow/blob/master/components/admission-webhook/pkg/apis/settings/v1alpha1/poddefault_types.go
      ##  - entries are currently NOT allowed, until the security model
      ##    for Workspace-level Pod metadata is defined
      ##
      labels: {}

      ## annotations to be applied to the Pod resource
      ##  - entries are currently NOT allowed, until the security model
      ##    for Workspace-level Pod metadata is defined
      ##
      annotations: {}

    ## volume configs
    ##
    volumes:

      ## the name of the PVC to mount as the home volume
      ##  - this PVC must already exist in the Namespace
      ##  - the access modes of this PVC are NOT validated, but it must be
      ##    mountable by the Workspace Pod, e.g. ReadWriteOnce (if only used by
      ##    one Workspace at a time) or ReadWriteMany
      ##  - the backend API only allows PVCs with the
      ##    `workspaces.kubeflow.org/can-mount: "true"` label
      ##  - the mount path is defined in the WorkspaceKind under
      ##    `spec.podTemplate.volumeMountPaths.home`
      ##
      home: "workspace-home-pvc"

      ## additional PVCs to mount
      ##  - these PVC must already exist in the Namespace
      ##  - the same PVC can be mounted multiple times with different `mountPaths`
      ##  - the access modes of these PVCs are NOT validated, but they must be
      ##    mountable by the Workspace Pod (e.g. ReadWriteMany if shared between
      ##    Workspaces, ReadOnlyMany is sufficient if `readOnly` is true)
      ##  - the backend API only allows PVCs with the
      ##    `workspaces.kubeflow.org/can-mount: "true"` label
      ##
      data:
        - pvcName: "workspace-data-pvc"
          mountPath: "/data/my-data"
          readOnly: false

      ## secrets to mount
      ##  - the secret must already exist in the Namespace
      ##  - secrets are mounted as folders with the secret keys as files
      ##
      secrets:
        - secretName: "workspace-secret"
          mountPath: "/secrets/my-secret"
          defaultMode: 420 # same as 0644 in octal

    ## the selected podTemplate options
    ##  - these are the user-selected options from the Workspace Spawner UI
    ##    which determine the PodSpec of the Workspace Pod
    ##
    options:

      ## the id of an imageConfig option
      ##  - options are defined in WorkspaceKind under
      ##    `spec.podTemplate.options.imageConfig.values[]`
      ##
      imageConfig: "jupyter-scipy:v1.11.1"

      ## the id of a podConfig option
      ##  - options are defined in WorkspaceKind under
      ##    `spec.podTemplate.options.podConfig.values[]`
      ##
      podConfig: "tiny_cpu"