version: "2"
run:
  allow-parallel-runners: true
issues:
  # report every violation on a line, not just the first one (e.g. multiple kubeapilinter rules)
  uniq-by-line: false
linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - errcheck
    - errorlint
    - exhaustive
    - ginkgolinter
    - goconst
    - gocritic
    - gocyclo
    - goheader
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - kubeapilinter
    - lll
    - misspell
    - modernize
    - nakedret
    - nolintlint
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    custom:
      kubeapilinter:
        type: module
        description: Kube API Linter lints Kube-like APIs based on API conventions and best practices.
        settings:
          # Rule documentation: https://github.com/kubernetes-sigs/kube-api-linter/blob/main/docs/linters.md
          linters:
            enable:
              # TODO: enable statusoptional once status fields are made optional
              - statussubresource
            disable:
              # TODO: the following rules have existing violations in
              # api/v1beta1 and are disabled until fixed. Most fixes change the
              # CRD schema or Go types, so each rule should be re-enabled in
              # its own PR (finding counts as of adoption).
              - arrayofstruct
              # godoc should start with the JSON field name
              - commentstart
              # defaulted status fields are currently required
              - defaultorrequired
              # defaulted fields must be optional + omitempty
              - defaults
              - nonpointerstructs
              # optional fields should be pointers
              - optionalfields
              # required fields need omitempty / pointers
              - requiredfields
              # missing +listType markers
              - ssatags
          lintersConfig: {}
    gocritic:
      disabled-checks:
        - assignOp
        - filepathJoin
        - paramTypeCombine
        - rangeValCopy
        - unnamedResult
        - whyNoLint
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    goheader:
      template: |-
        Copyright 2024.

        Licensed under the Apache License, Version 2.0 (the "License");
        you may not use this file except in compliance with the License.
        You may obtain a copy of the License at

            http://www.apache.org/licenses/LICENSE-2.0

        Unless required by applicable law or agreed to in writing, software
        distributed under the License is distributed on an "AS IS" BASIS,
        WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
        See the License for the specific language governing permissions and
        limitations under the License.
    misspell:
      locale: US
    modernize:
      disable:
        # Disable as this hides the API struct representation from devs
        - embedlit
    revive:
      rules:
        - name: comment-spacings
  exclusions:
    generated: lax
    rules:
      - linters:
          - kubeapilinter
        path-except: ^api/
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      - linters:
          - dupl
          - errcheck
          - goconst
          - gocyclo
          - gosec
        path: test/.*|.*_test\.go
      - linters:
          - gocritic
        text: 'importShadow: shadow of imported from ''sigs.k8s.io/controller-runtime/pkg/log'' package ''log'''
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kubeflow/notebooks/workspaces/controller
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
