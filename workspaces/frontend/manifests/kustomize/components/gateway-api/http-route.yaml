apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: workspaces-frontend
spec:
  parentRefs:
  - name: kubeflow-gateway
    namespace: kubeflow
  rules:
  # ReplacePrefixMatch is only valid on a rule with exactly one PathPrefix
  # match, so the bare path gets its own rule and is redirected to the prefix.
  - matches:
    - path:
        type: PathPrefix
        value: /workspaces/
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: workspaces-frontend
      port: 8080
  - matches:
    - path:
        type: Exact
        value: /workspaces
    filters:
    - type: RequestRedirect
      requestRedirect:
        path:
          type: ReplaceFullPath
          replaceFullPath: /workspaces/
        statusCode: 301
