apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: workspaces-backend
spec:
  parentRefs:
  - name: kubeflow-gateway
    namespace: kubeflow
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /workspaces/api/
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /api/
    backendRefs:
    - name: workspaces-backend
      port: 4000
