apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dev resources for when the Kubeflow dashboard is disabled.
#
# Without the dashboard there are no profiles, so the `user` dev user works out
# of the `default` namespace. This namespace is applied to every namespaced
# resource below, including the common samples pulled in from the controller.
namespace: default

resources:
  - admin.yaml
  - user.yaml
  - ../../../workspaces/controller/manifests/kustomize/samples/common
